name: Validate Windows Server Health Monitor

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PowerShell
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0.0

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./HealthMonitor.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null

          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          Write-Host "PowerShell syntax is valid."

      - name: Run automated tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $result = Invoke-Pester ./tests/HealthMonitor.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) {
            exit 1
          }
